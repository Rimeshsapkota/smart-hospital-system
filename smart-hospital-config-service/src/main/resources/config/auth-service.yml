server:
  port: 8144
#  servlet:
#    context-path: /auth-service
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/hms_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

cloud:
  config:
    override-system-properties: true
    fail-fast: true
    retry:
      max-attempts: 20
      initial-interval: 10000
      max-interval: 15000
