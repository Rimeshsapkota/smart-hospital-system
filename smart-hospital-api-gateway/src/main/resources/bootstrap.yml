spring:
  application:
    name: api-gateway

  cloud:
    config:
      import: optional:configserver:${CONFIG_URL:http://localhost:8888}  # ✅ use env var

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          globalcors:
            cors-configuration:
              '[/**]':
                allowedOrigins: "*"
                allowedHeaders: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/**
              filters :
                - RewritePath=/auth-service/(?<segment>.*), /${segment}

            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/patient-service/**
              filters:
                - AuthenticationFilter
                - RewritePath=/patient-service/(?<segment>.*), /${segment}
jwt:
  secret: G3n3r4t3dS3cr3tiu898787ui9808798u87u767y7ui986tr5jhuytghhyijjkloiuyhgtrfdedf
  expiration: 604800000

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway Service
        primaryName: API Gateway Service
      - url: /auth-service/v3/api-docs
        name: Auth Service
        primaryName: Patient Service
      - url: /patient-service/v3/api-docs
        name: Patient Service
        primaryName: Patient Service