spring:
  application:
    name: api-gateway

  cloud:
    config:
      import: optional:configserver:http://localhost:8888

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          globalcors:
            cors-configuration:
              '[/**]':
                allowedOrigins: "*"
                allowedHeaders: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/**
              filters :
                - RewritePath=/auth-service/(?<segment>.*), /${segment}

            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/patient-service/**
              filters:
                - AuthenticationFilter
                - RewritePath=/patient-service/(?<segment>.*), /${segment}
