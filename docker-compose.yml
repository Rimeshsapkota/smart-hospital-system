services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_DATABASE: hms_db
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - smarthospital-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-server:
    image: smart-hospital-discovery-server-1.0:latest
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - smarthospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  config-service:
    image: smart-hospital-config-service-1.0:latest
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
#      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - smarthospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  api-gateway:
    image: smart-hospital-api-gateway-1.0:latest
    container_name: api-gateway
    ports:
      - "8020:8020"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      CONFIG_URL: http://config-service:8888    # ✅ add this
      SPRING_CLOUD_CONFIG_OVERRIDESYSTEMPROPERTIES: "false"  # ✅ add this
    depends_on:
      discovery-server:
        condition: service_healthy
      config-service:
        condition: service_healthy             # ✅ wait for config
    networks:
      - smarthospital-network
    restart: unless-stopped

  auth-service:
    image: smart-hospital-auth-service-1.0:latest
    container_name: auth-service
    ports:
      - "8144:8144"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hms_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONFIG_OVERRIDESYSTEMPROPERTIES: "false"  # ✅ add this
    depends_on:
      discovery-server:
        condition: service_healthy
      config-service:
        condition: service_healthy             # ✅ wait for config
      mysql:
        condition: service_healthy
    networks:
      - smarthospital-network
    restart: unless-stopped

networks:
  smarthospital-network:
    driver: bridge

volumes:
  mysql-data: